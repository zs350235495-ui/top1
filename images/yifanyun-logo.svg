<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050515" />
      <stop offset="50%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#243b55" />
    </linearGradient>
    <linearGradient id="flipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)" />
  
  <!-- Flipping Wing / Soaring Cloud -->
  <path d="M 40 100 Q 90 40 160 70 Q 110 130 40 100 Z" fill="url(#flipGrad)" filter="url(#glow)" />
  <path d="M 50 115 
           A 16 16 0 0 1 45 88 
           A 22 22 0 0 1 85 75 
           A 26 26 0 0 1 140 90 
           A 16 16 0 0 1 137 115 Z" 
        fill="#ffffff" opacity="0.9" filter="url(#glow)" />

  <!-- Text -->
  <text x="100" y="165" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="22" fill="#00f2fe" text-anchor="middle" letter-spacing="2">一翻云</text>
</svg>
