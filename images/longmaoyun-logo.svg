<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#6441a5" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)" />
  
  <!-- Totoro ears on top of cloud -->
  <path d="M 70 65 Q 65 35 78 40 Q 88 45 82 70" fill="url(#cloudGrad)" />
  <path d="M 130 65 Q 135 35 122 40 Q 112 45 118 70" fill="url(#cloudGrad)" />
  
  <!-- Cloud body -->
  <path d="M 55 125 
           A 25 25 0 0 1 50 75 
           A 30 30 0 0 1 95 60 
           A 35 35 0 0 1 155 80 
           A 25 25 0 0 1 150 125 Z" 
        fill="url(#cloudGrad)" filter="url(#glow)" />
        
  <!-- Cute Totoro belly marks / whiskers -->
  <path d="M 85 90 Q 90 85 95 90" stroke="#1a0b2e" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 105 90 Q 110 85 115 90" stroke="#1a0b2e" stroke-width="3.5" fill="none" stroke-linecap="round" />
  
  <path d="M 75 105 Q 80 100 85 105" stroke="#1a0b2e" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 97 105 Q 100 100 103 105" stroke="#1a0b2e" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 115 105 Q 120 100 125 105" stroke="#1a0b2e" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Text -->
  <text x="100" y="165" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">龙猫云</text>
</svg>
