<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7971E" />
      <stop offset="100%" stop-color="#FFD200" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  
      <!-- Wing Feather Lines -->
      <path d="M 50,110 Q 100,50 150,65 Q 110,85 100,120 Q 80,100 50,110 Z" fill="url(#brandGrad)" filter="url(#glow)" />
      <path d="M 65,100 Q 110,60 140,75 Q 110,95 95,115 Z" fill="#FFFFFF" opacity="0.6" />
    

  <text x="100" y="166" font-family="'PingFang SC', 'Microsoft YaHei', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">鲲鹏加速</text>
</svg>
