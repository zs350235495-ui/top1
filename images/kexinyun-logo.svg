<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  
      <!-- Shield & Cloud -->
      <path d="M 100,45 L 140,62 V 95 C 140,120 100,138 100,138 C 100,138 60,120 60,95 V 62 Z" fill="none" stroke="url(#brandGrad)" stroke-width="6" filter="url(#glow)" />
      <path d="M 75,98 A 15,15 0 0,1 96,78 A 20,20 0 0,1 128,85 A 15,15 0 0,1 125,112 L 75,112 Z" fill="url(#brandGrad)" />
      <polyline points="90,95 98,103 112,88" fill="none" stroke="#0f2027" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    

  <text x="100" y="166" font-family="'PingFang SC', 'Microsoft YaHei', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">可信云</text>
</svg>
