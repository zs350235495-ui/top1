<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  
      <!-- Cloud & Map Grid Icon -->
      <path d="M 60,95 A 25,25 0 0,1 95,65 A 32,32 0 0,1 148,78 A 25,25 0 0,1 145,120 L 60,120 A 20,20 0 0,1 60,95 Z" fill="url(#brandGrad)" filter="url(#glow)" />
      <circle cx="85" cy="95" r="4" fill="#ffffff" />
      <circle cx="115" cy="85" r="4" fill="#ffffff" />
      <circle cx="130" cy="105" r="4" fill="#ffffff" />
      <line x1="85" y1="95" x2="115" y2="85" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="115" y1="85" x2="130" y2="105" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    

  <text x="100" y="166" font-family="'PingFang SC', 'Microsoft YaHei', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">云图机场</text>
</svg>
