<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#4286f4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)" />
  
  <!-- Intersecting "Cross-Border" Orbits -->
  <path d="M 30 110 Q 100 40 170 110" fill="none" stroke="url(#crossGrad)" stroke-width="4" filter="url(#glow)" />
  <path d="M 30 70 Q 100 140 170 70" fill="none" stroke="#52e5e7" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />

  <!-- Central High-Tech Cloud -->
  <path d="M 55 115 
           A 18 18 0 0 1 50 82 
           A 24 24 0 0 1 92 66 
           A 28 28 0 0 1 148 84 
           A 18 18 0 0 1 145 115 Z" 
        fill="url(#crossGrad)" opacity="0.95" filter="url(#glow)" />

  <!-- Text -->
  <text x="100" y="165" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">跨界云</text>
</svg>
