<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#243b55" />
    </linearGradient>
    <linearGradient id="u1s1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)" />
  
  <!-- Cloud Icon -->
  <path d="M 50 110 
           A 18 18 0 0 1 45 78 
           A 24 24 0 0 1 92 62 
           A 28 28 0 0 1 148 80 
           A 18 18 0 0 1 145 110 Z" 
        fill="url(#u1s1Grad)" filter="url(#glow)" />

  <!-- U1S1 Badge centered -->
  <text x="100" y="96" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#141e30" text-anchor="middle">U1S1</text>

  <!-- Text -->
  <text x="100" y="165" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="22" fill="#00F2FE" text-anchor="middle" letter-spacing="2">U1s1</text>
</svg>
