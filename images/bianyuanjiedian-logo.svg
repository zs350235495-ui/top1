<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  
      <!-- Hexagon Edge Mesh -->
      <polygon points="100,48 135,68 135,108 100,128 65,108 65,68" fill="none" stroke="url(#brandGrad)" stroke-width="5" filter="url(#glow)" />
      <circle cx="100" cy="48" r="6" fill="#E100FF" />
      <circle cx="135" cy="68" r="6" fill="#E100FF" />
      <circle cx="135" cy="108" r="6" fill="#E100FF" />
      <circle cx="100" cy="128" r="6" fill="#E100FF" />
      <circle cx="65" cy="108" r="6" fill="#E100FF" />
      <circle cx="65" cy="68" r="6" fill="#E100FF" />
      <circle cx="100" cy="88" r="8" fill="#FFFFFF" filter="url(#glow)" />
    

  <text x="100" y="166" font-family="'PingFang SC', 'Microsoft YaHei', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">边缘节点</text>
</svg>
