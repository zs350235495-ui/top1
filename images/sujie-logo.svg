<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  
      <!-- Speed Trails & Globe -->
      <circle cx="100" cy="90" r="38" fill="none" stroke="url(#brandGrad)" stroke-width="5" filter="url(#glow)" />
      <ellipse cx="100" cy="90" rx="38" ry="14" fill="none" stroke="url(#brandGrad)" stroke-width="3" opacity="0.8" />
      <path d="M 50,75 L 125,75 M 40,90 L 145,90 M 55,105 L 130,105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />
    

  <text x="100" y="166" font-family="'PingFang SC', 'Microsoft YaHei', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">速界</text>
</svg>
