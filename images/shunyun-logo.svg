<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a2035" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387" />
      <stop offset="100%" stop-color="#E94057" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="42" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  
      <!-- Lightning Bolt + Cloud -->
      <path d="M 55,90 A 22,22 0 0,1 85,65 A 28,28 0 0,1 135,75 A 22,22 0 0,1 135,115 L 55,115 Z" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.7" />
      <polygon points="105,45 80,92 100,92 90,135 125,82 103,82" fill="#FFE000" filter="url(#glow)" />
    

  <text x="100" y="166" font-family="'PingFang SC', 'Microsoft YaHei', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">瞬云</text>
</svg>
