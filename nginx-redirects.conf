# ==============================================================================
# 机场 TOP1 - 推广链接 (AFF) 301 隔离与合规重定向配置
# 适用环境: 独立 VPS / 宝塔面板 (aaPanel) / Nginx Web Server
# 部署方式: 在 Nginx 虚拟主机 server { ... } 配置块中添加:
#          include /path/to/jichangTOP1.com/nginx-redirects.conf;
# ==============================================================================

# 1. 严格下发 X-Robots-Tag 响应头，阻止搜索爬虫抓取中转路径
location ^~ /go {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # 环球梯 (HuanQiuTi)
    location ~* ^/go/(?:ap-)?huanqiuti/?$ {
        return 301 https://123pps01.huanqiutiaff.com/#/?code=j5VBUvw0;
    }

    # 大佬云 (DaLaoYun)
    location ~* ^/go/(?:ap-)?dalaoyun/?$ {
        return 301 https://ppsvip01.dalaoyunaff.com/#/?code=Iz1GlCVa;
    }

    # 云界线 (YunJieXian)
    location ~* ^/go/(?:ap-)?yunjiexian/?$ {
        return 301 https://pp01.yunjiexianaff.com/#/?code=bp0ZSKBV;
    }

    # 闪电鼠 (ShanDianShu)
    location ~* ^/go/(?:ap-)?shandianshu/?$ {
        return 301 https://ppsvip01.shandianshuaff.com/#/?code=QbLF8tjB;
    }

    # 神行加速 (ShenXing VPN)
    location ~* ^/go/(?:ap-)?shenxing/?$ {
        return 301 https://pps123.shenxingaff.com/#/?code=6tQ7zHUc;
    }

    # 榴莲云 (LiuLianYun)
    location ~* ^/go/(?:ap-)?liulianyun/?$ {
        return 301 https://123pp01.liulianyunaff.com/#/?code=MsZP3u7G;
    }

    # 云图机场 (YunTu)
    location ~* ^/go/(?:ap-)?yuntu/?$ {
        return 301 https://super.ytjcok.org/#/register?code=poKwFVtv;
    }

    # 瞬云 (ShunYun)
    location ~* ^/go/(?:ap-)?shunyun/?$ {
        return 301 https://ddd.jichang.best/#/register?code=nldUZaYc;
    }

    # 可信云 (KeXinYun)
    location ~* ^/go/(?:ap-)?kexinyun/?$ {
        return 301 https://everett7623.kosingaff.com/#/?code=sFKKfEYs;
    }

    # 速界 (SuJie)
    location ~* ^/go/(?:ap-)?sujie/?$ {
        return 301 https://pygllc.speedworldaff.cc/#/?code=kcoensXG;
    }

    # 极连云 (JiLianYun)
    location ~* ^/go/(?:ap-)?jilianyun/?$ {
        return 301 https://haozevpn.jlyvipaff.com/#/?code=jwCMOvQO;
    }

    # 鲲鹏加速 (KunPeng)
    location ~* ^/go/(?:ap-)?kunpeng/?$ {
        return 301 https://kunpengjiasu.com/#/register?code=WPugVZUe;
    }

    # 快狸快狸 (KuaiLi)
    location ~* ^/go/(?:ap-)?kuaili/?$ {
        return 301 https://fanxiaobin.kuailiaff.com/#/?code=e0cAmK7F;
    }

    # 边缘节点 (EdgeNode)
    location ~* ^/go/(?:ap-)?bianyuanjiedian/?$ {
        return 301 https://wep.edgenovaaff.com/#/?code=mLLL6h6F;
    }

    # 未显式声明匹配的子路径，回退重写至 /go.html 处理
    try_files $uri /go.html?$args;
}

